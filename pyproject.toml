[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "crcforge"
dynamic = ["version"]
description = "Calculate, identify, reverse-engineer and forge CRCs and checksums from the command line."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Fatih Kayran" }]
keywords = [
  "crc",
  "checksum",
  "reverse-engineering",
  "reveng",
  "crc32",
  "crc16",
  "modbus",
  "firmware",
  "protocol-analysis",
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Information Technology",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Security",
  "Topic :: Software Development :: Embedded Systems",
  "Topic :: System :: Networking",
  "Topic :: Utilities",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.10", "build>=1.2", "twine>=5"]

[project.urls]
Homepage = "https://github.com/kayranfatih/crcforge"
Documentation = "https://kayranfatih.github.io/crcforge/"
Changelog = "https://github.com/kayranfatih/crcforge/blob/main/CHANGELOG.md"
Issues = "https://github.com/kayranfatih/crcforge/issues"

[project.scripts]
crcforge = "crcforge.cli:main"

[tool.setuptools.dynamic]
version = { attr = "crcforge.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
crcforge = ["py.typed"]

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"src/crcforge/catalog_crc.py" = ["E501"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unreachable = true
files = ["src/crcforge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
source = ["crcforge"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = ["if __name__ == .__main__.:", "pragma: no cover"]
